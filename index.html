<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello!?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500&family=Patrick+Hand&family=Roboto+Slab:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --bg:#fff; --ink:#000; --green:#4f8b72; --paper:#fff; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:#fff; }
  body {
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:clamp(40px,9vh,110px) 24px; color:var(--ink);
  }
  .logo { height:min(420px,50vh); width:auto; max-width:70vw; display:block; }
  h1 {
    margin:clamp(24px,5vh,56px) 0 clamp(28px,5vh,56px);
    font:500 clamp(44px,8vw,72px)/1 "Pixelify Sans", "Courier New", monospace;
    letter-spacing:.02em;
  }
  form { width:min(495px,100%); }
  input {
    width:100%; border:0; border-radius:0; background:var(--green); color:#fff;
    font:400 19px "Aptos Slab", "Roboto Slab", Rockwell, serif; letter-spacing:.02em;
    text-align:center; padding:8px 12px;
  }
  input::placeholder { color:#fff; opacity:1; }
  input:focus-visible { outline:3px solid var(--ink); outline-offset:3px; }
  .msg { min-height:1.5em; margin:12px 0 0; text-align:center;
         font:400 18px "Patrick Hand", system-ui, sans-serif; }
  @media (prefers-reduced-motion:no-preference) {
    input.shake { animation:shake .3s; }
    @keyframes shake { 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  }
</style>
</head>
<body>
  <img class="logo" src="assets/key.png" alt="Lantern key">
  <h1>Hello!?</h1>
  <form id="gate" autocomplete="off">
    <input id="pw" type="password" placeholder="password please" aria-label="Password" autofocus>
    <p class="msg" id="msg" role="status"></p>
  </form>

<script>
  // Each person has their own password, stored as a SHA-256 hash. It also tells the
  // document who is typing. Defaults: "rina" and "jules".
  // To change one: echo -n "newpassword" | sha256sum
  const HASHES = {
    Rina:  "8444da51ab98379d96a9d9c971b6ed0cf68b4bde471119dc932b09ec23f8b3f4",
    Jules: "9caeb25ba8e9ffac919cb1942ac60bda5b5be27499b976f7b49a3b7c9627a164"
  };
  // Where to go after unlocking (your collaborative document site).
  const DOC_URL = "doc/";

  async function sha256(text) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
  }

  const form = document.getElementById("gate");
  const pw = document.getElementById("pw");
  const msg = document.getElementById("msg");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const hash = await sha256(pw.value);
    const who = Object.keys(HASHES).find(n => HASHES[n] === hash);
    if (who) {
      try { sessionStorage.setItem("unlocked", "1"); sessionStorage.setItem("user", who); } catch (_) {}
      location.href = DOC_URL;
    } else {
      msg.textContent = "Wrong password. Try again.";
      pw.classList.remove("shake"); void pw.offsetWidth; pw.classList.add("shake");
      pw.select();
    }
  });
</script>
</body>
</html>
